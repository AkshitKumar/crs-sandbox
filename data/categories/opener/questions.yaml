# Opener question bank.
#
# Controlled ATR policies ask questions in the YAML order below: openers first,
# then followups. In adaptive conversations, openers retain their fixed order;
# after all openers are asked, the agent may select a followup by topic. Questions
# sharing a topic retain their YAML order.

openers:
  - id: use_case
    topic: use_case
    text: "What do you primarily need to open — food cans, wine bottles, or capped bottles?"

  - id: budget
    topic: budget
    text: "Do you have a budget range?"

  - id: frequency_size
    topic: capacity
    text: "How often will you use it, and what sizes or types of containers does it need to handle?"

followups:
  - id: operation
    topic: operation
    text: "Would you prefer a manual opener, an electric one, or either?"

  - id: accessibility
    topic: accessibility
    text: "Do hand strength, wrist pain, grip, or one-handed operation affect what will be comfortable?"

  - id: edge_safety
    topic: safety
    text: "Is leaving a smooth, touchable edge important to you?"

  - id: heavy_use
    topic: durability
    text: "Does it need to withstand heavy daily use or unusually large or thick cans?"

  - id: other_requirements
    topic: other
    text: "Anything else we haven't covered that's a must-have or dealbreaker?"

  - id: portability
    topic: portability
    text: "Will it stay on a counter, fit in a drawer, or travel in a camping or emergency kit?"

  - id: cleaning
    topic: maintenance
    text: "How important is easy cleaning or a removable, washable cutting part?"

  - id: power
    topic: power
    text: "If it's electric, do you prefer a plug-in, battery-powered, or rechargeable model?"

  - id: noise
    topic: noise
    text: "Is motor noise a concern?"

  - id: multifunction
    topic: features
    text: "Would built-in bottle-opening, corkscrew, or other functions be useful?"

  - id: material
    topic: material
    text: "Do you have preferences for stainless steel, corrosion resistance, or handle materials?"

  - id: replacement_parts
    topic: maintenance
    text: "Do you care about replaceable cutting parts or long-term repairability?"

  - id: brand
    topic: brand
    text: "Do you have any brand preferences, or brands you'd rather avoid?"
