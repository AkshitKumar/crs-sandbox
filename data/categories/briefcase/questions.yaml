# Briefcase question bank.
#
# Controlled ATR policies ask questions in the YAML order below: openers first,
# then followups. In adaptive conversations, openers retain their fixed order;
# after all openers are asked, the agent may select a followup by topic. Questions
# sharing a topic retain their YAML order.

openers:
  - id: use_case
    topic: use_case
    text: "What will you mainly use the briefcase for?"

  - id: budget
    topic: budget
    text: "Do you have a budget range?"

  - id: device_size
    topic: capacity
    text: "What laptop or tablet size does it need to fit?"

followups:
  - id: material_style
    topic: material
    text: "What material do you prefer — leather, vegan leather, canvas, nylon, or hard-sided?"

  - id: capacity_profile
    topic: capacity
    text: "Would you prefer a slim briefcase or additional carrying capacity?"

  - id: expected_longevity
    topic: durability
    text: "How long do you expect the briefcase to last?"

  - id: other_requirements
    topic: other
    text: "Is there any other must-have or dealbreaker?"

  - id: carry_style
    topic: form_factor
    text: "How would you prefer to carry it — handles, shoulder strap, crossbody, or rolling?"

  - id: weather_protection
    topic: protection
    text: "How much rain resistance and device protection do you need?"

  - id: organization
    topic: organization
    text: "Do you want dedicated pockets for documents, accessories, and small items?"

  - id: closure_security
    topic: security
    text: "Do you need a zipper, flap, combination lock, or another secure closure?"

  - id: travel_features
    topic: travel
    text: "Will you travel with it, and would an expandable section or luggage pass-through help?"

  - id: weight
    topic: portability
    text: "How important is keeping the empty briefcase lightweight?"

  - id: durability
    topic: durability
    text: "How important are reinforced construction, repairability, and long-term durability?"

  - id: animal_free
    topic: material
    text: "Do you need it to be completely animal-free?"

  - id: color
    topic: style
    text: "Do you have a preferred color or dress-code requirement?"

  - id: brand
    topic: brand
    text: "Do you have any brand preferences, or brands you'd rather avoid?"
