# Laptop question bank.
#
# Controlled ATR policies ask questions in the YAML order below: openers first,
# then followups. In adaptive conversations, openers retain their fixed order;
# after all openers are asked, the agent may select a followup by topic. Questions
# sharing a topic retain their YAML order.

openers:
  - id: use_case
    topic: use_case
    text: "What do you expect to use this laptop for most?"

  - id: budget
    topic: budget
    text: "Do you have a budget range?"

followups:
  - id: ram
    topic: memory
    text: "Do you have any requirements or preferences about memory (RAM)?"

  - id: screen_size
    topic: form_factor
    text: "Do you have a preferred screen size?"

  - id: storage
    topic: storage
    text: "Do you have any requirements or preferences about storage?"

  - id: battery
    topic: battery
    text: "How important is battery life to you?"

  - id: os_preference
    topic: os
    text: "Do you have an operating system preference?"

  - id: display_quality
    topic: display
    text: "Do you care about display quality — high resolution, color accuracy, OLED, that kind of thing?"

  - id: weight
    topic: portability
    text: "How important are weight and portability to you?"

  - id: gpu_need
    topic: gpu
    text: "Do you have any requirements or preferences about graphics performance?"

  - id: refresh_rate
    topic: display
    text: "Is a high refresh rate (120Hz or higher) important to you, for gaming or smoother scrolling?"

  - id: ports
    topic: ports
    text: "Are there specific ports you need built in — USB-A, HDMI, SD card, Thunderbolt?"

  - id: keyboard
    topic: keyboard
    text: "Anything specific about the keyboard — backlit, full-size with numpad, particular layout?"

  - id: build_quality
    topic: build
    text: "How much does build quality matter — metal chassis, sturdy hinges, that sort of thing?"

  - id: brand
    topic: brand
    text: "Do you have any brand preferences, or brands you'd rather avoid?"

  - id: form_factor_2in1
    topic: form_factor
    text: "Would a 2-in-1 or touchscreen design be useful, or do you want a traditional clamshell?"

  - id: fan_noise
    topic: noise
    text: "Is fan noise something you'd want to minimize — for quiet environments or recording?"

  - id: webcam
    topic: webcam
    text: "How important is webcam and microphone quality for video calls?"

  - id: ecosystem
    topic: ecosystem
    text: "Do you have other devices you'd like this to work well with — phone, tablet, existing accessories?"

  - id: gaming_titles
    topic: gpu
    text: "If you're gaming, what kinds of titles — competitive esports, AAA at high settings, or casual?"

  - id: creative_software
    topic: performance
    text: "If this is for creative work, which apps — Photoshop, Premiere, Blender, Logic, something else?"

  - id: travel_frequency
    topic: portability
    text: "How often will you actually carry this laptop with you — daily, occasionally, rarely?"
