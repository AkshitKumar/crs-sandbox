category: air_purifier
display_name: Air Purifier

catalog_path: data/categories/air_purifier/products.jsonl
questions_path: data/categories/air_purifier/questions.yaml
index_dir: data/categories/air_purifier/index

# Guaranteed recall candidates added to every fresh retrieval pool before the
# LLM chooses the final three products.
default_slate:
  - B07VVK39F7  # Levoit Core 300-P: compact/value option, rating-volume rank 4
  - B0DJG1731C  # Winix 5510: established midrange large-room option, rank 11
  - B0BN2MGV5H  # Blueair 211i Max: premium large-room option, rank 44

scrape:
  seed_queries:
    - "air purifier"
    - "hepa air purifier"
    - "air purifier for large rooms"
    - "air purifier for bedroom"
    - "air purifier for allergies"
    - "air purifier for pets"
    - "ozone free air purifier"
    - "quiet air purifier"
    - "air purifier for asthma"
    - "smart air purifier"
    - "air purifier for smoke"
    - "multi room air purifier"
  target_products: 300
  reviews_per_product: 8
