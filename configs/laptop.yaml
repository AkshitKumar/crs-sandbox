category: laptop
display_name: Laptop

catalog_path: data/categories/laptop/products.jsonl
questions_path: data/categories/laptop/questions.yaml
index_dir: data/categories/laptop/index

# Fixed turn-zero assortment shown before any preferences are elicited.
default_slate:
  - B0CLHCWNV8  # ASUS Vivobook 14: portable/general option
  - B0F167PYK7  # Dell 15: everyday productivity / onsite service option
  - B0F5KTGDS9  # Acer Nitro V: gaming/performance option

scrape:
  seed_queries:
    - "laptop"
    - "gaming laptop"
    - "laptop for work"
    - "laptop for students"
    - "ultrabook"
    - "premium travel laptop"
    - "2 in 1 laptop"
    - "business laptop"
    - "durable laptops"
    - "14 inch laptop"
    - "lightweight laptops"
    - "upgradable laptop"
    - "enthusiast laptop"
    - "linux laptop"
    - "quiet laptop"
  target_products: 300
  reviews_per_product: 8
