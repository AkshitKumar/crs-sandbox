category: laptop
display_name: Laptop

catalog_path: data/categories/laptop/products.jsonl
questions_path: data/categories/laptop/questions.yaml
index_dir: data/categories/laptop/index

# Fixed zero-information recommendation shown by REC and checkpoint 0.
default_slate:
  - B0C4G4L53W  # HP Pavilion 15: rating-volume rank 4
  - B0BSJ46KY9  # Lenovo IdeaPad 3i Chromebook: rating-volume rank 6
  - B0F5KTGDS9  # Acer Nitro V: gaming/performance option, rating-volume rank 49

scrape:
  seed_queries:
    - "laptop"
    - "gaming laptop"
    - "laptop for work"
    - "laptop for students"
    - "ultrabook"
    - "premium travel laptop"
    - "2 in 1 laptop"
    - "business laptop"
    - "durable laptops"
    - "14 inch laptop"
    - "lightweight laptops"
    - "upgradable laptop"
    - "enthusiast laptop"
    - "linux laptop"
    - "quiet laptop"
  target_products: 300
  reviews_per_product: 8
